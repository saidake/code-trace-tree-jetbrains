# Creates a GitHub Release for the current plugin version tag when missing.
# Used when a version tag was pushed but no Release was published (e.g. local gh auth unavailable).

name: Ensure GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release if tag exists without a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^val pluginVersion = "\(.*\)"/\1/p' main/build.gradle.kts | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read pluginVersion from main/build.gradle.kts"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "Checking release for ${TAG}"

          if ! git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            # Tags may not be fetched as local refs; try remote
            if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
              echo "Tag ${TAG} does not exist yet; skipping."
              exit 0
            fi
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists."
            exit 0
          fi

          NOTES="$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            --jq .body 2>/dev/null || true)"
          if [ -z "${NOTES}" ]; then
            NOTES="## What's new

- **Trace Profiles** — keep multiple independent trace trees (default: \`main\`)
- Add, switch, and delete profiles from the tool window
- **Import/Export** — export current or all profiles; import with explicit replace / new / merge choices"
          fi

          gh release create "${TAG}" --title "${TAG}" --notes "${NOTES}"
          echo "Created GitHub Release ${TAG}"
