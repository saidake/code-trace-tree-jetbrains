# Build and Release
#
# Builds the plugin ZIP and Claude skill ZIP, attaches both to the GitHub Release,
# and publishes to JetBrains Marketplace.
# Triggered on push of a git tag matching v* (e.g. v1.0.8).
# Release title format: "Code Trace Tree vX.Y.Z"
# Attachments: plugin zip + code-trace-tree-skill-X.Y.Z.zip

name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: jetbrains
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Package Claude skill ZIP
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          SKILL_ZIP="code-trace-tree-skill-${VERSION}.zip"
          STAGE="$(mktemp -d)"
          cp -a .claude/skills/code-trace-tree "$STAGE/"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/$SKILL_ZIP" code-trace-tree)
          echo "SKILL_ZIP=$SKILL_ZIP" >> "$GITHUB_ENV"
          ls -la "$SKILL_ZIP"
          unzip -l "$SKILL_ZIP"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree
          path: main/build/distributions/*.zip

      - name: Upload Claude skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree-skill
          path: code-trace-tree-skill-*.zip

      - name: Write release notes
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          cat > release-notes.md <<EOF
          # What's New

          - Update Marketplace plugin icons

          # Install the Plugin with \`zip\` file

          1. Download the release \`.zip\` file.
          2. Open the IDE plugin settings.
          3. Select **Install Plugin from Disk**.
          4. Choose the downloaded \`.zip\` file.
          5. Restart the IDE if required.

          # Install Claude Skill (Linux & macOS)

          Download the Code Trace Tree Claude Skill \`zip\` file, and extract it into your Claude skills directory.

          For a global installation:

          \`\`\`bash
          curl -L https://github.com/saidake/code-trace-tree-jetbrains/releases/download/v${VERSION}/code-trace-tree-skill-${VERSION}.zip -o code-trace-tree-skill-${VERSION}.zip
          unzip code-trace-tree-skill-${VERSION}.zip -d ~/.claude/skills/
          rm code-trace-tree-skill-${VERSION}.zip
          \`\`\`

          For a project-level installation:

          \`\`\`bash
          curl -L https://github.com/saidake/code-trace-tree-jetbrains/releases/download/v${VERSION}/code-trace-tree-skill-${VERSION}.zip -o code-trace-tree-skill-${VERSION}.zip
          mkdir -p .claude/skills
          unzip code-trace-tree-skill-${VERSION}.zip -d .claude/skills/
          rm code-trace-tree-skill-${VERSION}.zip
          \`\`\`

          # Install Claude Skill (Windows)

          Download the Code Trace Tree Claude Skill \`zip\` file, and extract it into your Claude skills directory.

          For a global installation using PowerShell:

          \`\`\`powershell
          Invoke-WebRequest -Uri "https://github.com/saidake/code-trace-tree-jetbrains/releases/download/v${VERSION}/code-trace-tree-skill-${VERSION}.zip" -OutFile "code-trace-tree-skill-${VERSION}.zip"
          Expand-Archive -Path "code-trace-tree-skill-${VERSION}.zip" -DestinationPath "\$HOME\\.claude\\skills"
          Remove-Item "code-trace-tree-skill-${VERSION}.zip"
          \`\`\`

          For a project-level installation using PowerShell:

          \`\`\`powershell
          Invoke-WebRequest -Uri "https://github.com/saidake/code-trace-tree-jetbrains/releases/download/v${VERSION}/code-trace-tree-skill-${VERSION}.zip" -OutFile "code-trace-tree-skill-${VERSION}.zip"
          New-Item -ItemType Directory -Force -Path ".claude\\skills"
          Expand-Archive -Path "code-trace-tree-skill-${VERSION}.zip" -DestinationPath ".claude\\skills"
          Remove-Item "code-trace-tree-skill-${VERSION}.zip"
          \`\`\`
          EOF

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PLUGIN_ZIP="$(ls main/build/distributions/*.zip | head -n1)"
          SKILL_ZIP="${SKILL_ZIP:-code-trace-tree-skill-${VERSION}.zip}"
          TITLE="Code Trace Tree ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PLUGIN_ZIP" "$SKILL_ZIP" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              "$PLUGIN_ZIP" \
              "$SKILL_ZIP"
          fi

      - name: Publish plugin
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        continue-on-error: true
