# Build and Release
#
# Builds the plugin ZIP and agent skill ZIPs, attaches them to the GitHub Release,
# and publishes to JetBrains Marketplace.
# Triggered on push of a git tag matching v* (e.g. v1.0.8).
# Release title format: "Code Trace Tree vX.Y.Z"
# Attachments: plugin zip + code-trace-tree-skill-<agent>-X.Y.Z.zip
# Release notes are written manually (CI does not generate or overwrite them).

name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: jetbrains
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Package agent skill ZIPs
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          python skills/package_skills.py --zip --version "$VERSION"
          ls -la dist/skills/
          unzip -l "dist/skills/code-trace-tree-skill-claude-${VERSION}.zip"
          echo "SKILL_DIR=dist/skills" >> "$GITHUB_ENV"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree
          path: main/build/distributions/*.zip

      - name: Upload skill artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree-skill
          path: dist/skills/code-trace-tree-skill-*.zip

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PLUGIN_ZIP="$(ls main/build/distributions/*.zip | head -n1)"
          TITLE="Code Trace Tree ${TAG}"
          mapfile -t SKILL_ZIPS < <(ls dist/skills/code-trace-tree-skill-*.zip)

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PLUGIN_ZIP" "${SKILL_ZIPS[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "" \
              "$PLUGIN_ZIP" \
              "${SKILL_ZIPS[@]}"
          fi

      - name: Publish plugin
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        continue-on-error: true
