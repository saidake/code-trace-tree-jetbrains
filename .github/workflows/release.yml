# Build and Release
#
# Builds the plugin ZIP and shared agent skill ZIP, attaches them to the GitHub Release,
# and publishes to JetBrains Marketplace.
# Triggered on push of a git tag matching v* (e.g. v1.0.8).
# Release title format: "vX.Y.Z"
# Attachments: plugin zip + code-trace-tree-skill-X.Y.Z.zip
# Release notes are written manually (CI does not generate or overwrite them).

name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: jetbrains
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Package agent skill ZIP
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist/skills
          rm -f dist/skills/code-trace-tree-skill-*.zip
          (
            cd skills
            zip -r "../dist/skills/code-trace-tree-skill-${VERSION}.zip" code-trace-tree \
              -x '*/__pycache__/*' '*.pyc' '*/.DS_Store'
          )
          ls -la dist/skills/
          unzip -l "dist/skills/code-trace-tree-skill-${VERSION}.zip"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree
          path: main/build/distributions/*.zip

      - name: Upload skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-trace-tree-skill
          path: dist/skills/code-trace-tree-skill-*.zip

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          PLUGIN_ZIP="$(ls main/build/distributions/*.zip | head -n1)"
          SKILL_ZIP="dist/skills/code-trace-tree-skill-${VERSION}.zip"
          TITLE="${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PLUGIN_ZIP" "$SKILL_ZIP" --clobber
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "" \
              "$PLUGIN_ZIP" \
              "$SKILL_ZIP"
          fi

      - name: Publish plugin
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        continue-on-error: true
